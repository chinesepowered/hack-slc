apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
    app.kubernetes.io/name: capykube
    app.kubernetes.io/component: api
spec:
  # One replica: the demo clock and the crowd simulator live in this process.
  # Recreate keeps two simulators from running side by side during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
        app.kubernetes.io/name: capykube
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEAM_NAME
              value: "capykube2"
            - name: DEPLOYMENT_ENVIRONMENT
              value: "hackathon"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ES_URL
              value: "http://es:9200"
            # Multilingual search: Jina on Elastic Cloud Serverless (optional).
            - name: ES_CLOUD_URL
              value: "https://my-elasticsearch-project-daf7e2.es.asia-northeast1.gcp.elastic.cloud:443"
            - name: ES_CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: capykube-secrets
                  key: ES_CLOUD_API_KEY
                  optional: true
            - name: OPS_KEY
              valueFrom:
                secretKeyRef:
                  name: capykube-secrets
                  key: OPS_KEY
                  optional: true
            # Created out of band (never committed): see README, "Secrets".
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: capykube-secrets
                  key: ELASTIC_PASSWORD
                  optional: true
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: capykube-secrets
                  key: DASH0_AUTH_TOKEN
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: capykube-secrets
                  key: OPENAI_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
