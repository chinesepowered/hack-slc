apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
    app.kubernetes.io/name: capykube
    app.kubernetes.io/component: api
spec:
  # One replica: the demo clock and the crowd simulator live in this process.
  # Recreate keeps two simulators from running side by side during a rollout.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
        app.kubernetes.io/name: capykube
        app.kubernetes.io/component: api
    spec:
      # The app never calls the Kubernetes API, so it gets no API token.
      automountServiceAccountToken: false
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TEAM_NAME
              value: "capykube2"
            - name: DEPLOYMENT_ENVIRONMENT
              value: "hackathon"
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Replay the minutes around the 2:00 PM rush (1:42 to 2:14 PM
            # Mountain Time), so a visitor sees a room fill up within a minute
            # or two. The demo controls can still jump anywhere in the day.
            - name: SIM_LOOP_START
              value: "2026-11-11T20:42:00Z"
            - name: SIM_LOOP_END
              value: "2026-11-11T21:14:00Z"
            - name: ES_URL
              value: "http://es:9200"
            # Multilingual search: Jina on Elastic Cloud Serverless (optional).
            - name: ES_CLOUD_URL
              value: "https://my-elasticsearch-project-daf7e2.es.asia-northeast1.gcp.elastic.cloud:443"
            - name: ES_CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: capykube-secrets
                  key: ES_CLOUD_API_KEY
                  optional: true
            - name: OPS_KEY
              valueFrom:
                secretKeyRef:
                  name: capykube-secrets
                  key: OPS_KEY
                  optional: true
            # Created out of band (never committed): see README, "Secrets".
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: capykube-secrets
                  key: ELASTIC_PASSWORD
                  optional: true
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: capykube-secrets
                  key: DASH0_AUTH_TOKEN
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: capykube-secrets
                  key: OPENAI_API_KEY
                  optional: true
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            # Nothing is written to the image: logs go to stdout and state
            # lives in Elasticsearch. /tmp is a small scratch volume.
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
