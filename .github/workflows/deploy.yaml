# On every push to main: build the image, push it to GHCR, and point
# deploy/kustomization.yaml at it. Argo CD sees that commit and deploys it.
name: build-and-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/kustomization.yaml
      - "**.md"
      # Documentation and its images are not part of the image.
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    # Only in your copy: the template repo itself keeps its placeholders.
    if: github.repository != 'skyhook-io/cnh-starter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Image name and tag
        id: meta
        run: |
          # The image is published as <owner>/<repo>/app. A package takes the
          # repository's visibility when a workflow first creates it, and the
          # original <owner>/<repo> package was created while this repository
          # was still private, so the cluster could not pull it.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/app" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: push
        # The registry once refused a push (permission_denied: write_package)
        # that the same token had made minutes earlier, so one refusal gets a
        # second try before the run fails.
        continue-on-error: true
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Push again if the first try was refused
        if: steps.push.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Check the cluster can pull the image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          # The cluster pulls without credentials. A private package would leave
          # the rollout in ImagePullBackOff, so stop here, before the deploy
          # commit, and the cluster keeps running the last good image.
          repo="${IMAGE#ghcr.io/}"
          token=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull" | jq -r '.token // empty')
          if [ -z "$token" ]; then
            code="no anonymous token"
          else
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${TAG}")
          fi
          if [ "$code" != "200" ]; then
            echo "::error::${IMAGE}:${TAG} can't be pulled without credentials (${code}). Make the package public, then re-run this workflow."
            exit 1
          fi
          echo "${IMAGE}:${TAG} can be pulled without credentials."

      - name: Point the manifests at the new image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Set the image on top of the latest main, not on the commit this run
          # built. A push that landed during the build (yours, or the previous
          # run's deploy commit) then can't conflict; retry if one lands mid-push.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            yq -i '(.images[] | select(.name == "app")) |= (.newName = strenv(IMAGE) | .newTag = strenv(TAG))' deploy/kustomization.yaml
            if git diff --quiet; then exit 0; fi
            git commit -qam "deploy: ${TAG} [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Couldn't push the deploy commit after 5 tries." >&2
          exit 1
